  <text x="750" y="478" font-family="'Segoe UI', 'Noto Sans', system-ui, sans-serif" font-size="14" fill="#999999">10 XP per completed session (configurable)</text>
  <text x="750" y="526" font-family="'Segoe UI', 'Noto Sans', system-ui, sans-serif" font-size="14" fill="#999999">level growth: base 100 XP + 50 per level</text>
  <text x="750" y="574" font-family="'Segoe UI', 'Noto Sans', system-ui, sans-serif" font-size="14" fill="#999999">3 local achievements (first, ten, hundred sessions)</text>
  <text x="750" y="622" font-family="'Segoe UI', 'Noto Sans', system-ui, sans-serif" font-size="14" fill="#999999">transactions immutable and idempotent</text>

