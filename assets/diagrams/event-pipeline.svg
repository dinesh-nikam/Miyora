  <rect x="680" y="170" width="560" height="40" rx="18" fill="#1a1a1a" stroke="none"/>
  <rect x="680" y="210" width="560" height="10" rx="5" fill="#52a8ff"/>
  <text x="750" y="200" font-family="'Segoe UI', 'Noto Sans', system-ui, sans-serif" font-size="22" font-weight="800" fill="#ffffff">Desktop overlay</text>
  <text x="750" y="258" font-family="'Segoe UI', 'Noto Sans', system-ui, sans-serif" font-size="14" fill="#999999">transparent always-on-top window</text>
  <text x="750" y="306" font-family="'Segoe UI', 'Noto Sans', system-ui, sans-serif" font-size="14" fill="#999999">shows the selected pet Â· pause/resume via Tauri command</text>
  <text x="750" y="354" font-family="'Segoe UI', 'Noto Sans', system-ui, sans-serif" font-size="14" fill="#999999">updates after every accepted event</text>

