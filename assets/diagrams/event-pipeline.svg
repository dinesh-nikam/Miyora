  <text x="40" y="66" font-family="'Segoe UI', 'Noto Sans', system-ui, sans-serif" font-size="40" font-weight="800" fill="#ffffff">Hook event pipeline</text>
  <text x="40" y="104" font-family="'Segoe UI', 'Noto Sans', system-ui, sans-serif" font-size="17" fill="#999999">CLI: <tspan font-weight="700" fill="#52a8ff">agentpet hook --adapter claude_code &lt; payload.json</tspan></text>
  <text x="40" y="132" font-family="'Segoe UI', 'Noto Sans', system-ui, sans-serif" font-size="17" fill="#999999">Events persist before acknowledgement; replays are safe.</text>

  <rect x="40" y="170" width="560" height="150" rx="18" fill="#111111" stroke="#4a4a4a"/>
  <rect x="40" y="170" width="560" height="40" rx="18" fill="#1a1a1a" stroke="none"/>
  <rect x="40" y="210" width="560" height="10" rx="5" fill="#52a8ff"/>
  <text x="110" y="200" font-family="'Segoe UI', 'Noto Sans', system-ui, sans-serif" font-size="22" font-weight="800" fill="#ffffff">Claude Code hook (filesystem)</text>
  <text x="110" y="266" font-family="'Segoe UI', 'Noto Sans', system-ui, sans-serif" font-size="14" fill="#999999">payload fields: session_id, hook_event_name, tool_name, tool_use_id, cwd</text>
  <text x="110" y="312" font-family="'Segoe UI', 'Noto Sans', system-ui, sans-serif" font-size="14" fill="#999999">events: SessionStart Â· UserPromptSubmit Â· PreToolUse Â· PostToolUse Â· Notification Â· Stop</text>

  <line x1="320" y1="240" x2="320" y2="290" stroke="#333333" stroke-width="1"/>
  <polygon points="308,284 320,290 332,284" fill="#52a8ff"/>

  <rect x="40" y="300" width="560" height="144" rx="18" fill="#111111" stroke="#4a4a4a"/>
  <rect x="40" y="300" width="560" height="40" rx="18" fill="#1a1a1a" stroke="none"/>
  <rect x="40" y="340" width="560" height="10" rx="5" fill="#52a8ff"/>
  <text x="110" y="330" font-family="'Segoe UI', 'Noto Sans', system-ui, sans-serif" font-size="22" font-weight="800" fill="#ffffff">agentpet hook` (CLI)</text>
  <text x="110" y="388" font-family="'Segoe UI', 'Noto Sans', system-ui, sans-serif" font-size="14" fill="#999999">parse + validate documented payload Â· deterministic event_id (UUIDv5)</text>
  <text x="110" y="436" font-family="'Segoe UI', 'Noto Sans', system-ui, sans-serif" font-size="14" fill="#999999">privacy filter: project path and tool use ids removed; cwd redacted</text>
  <text x="110" y="484" font-family="'Segoe UI', 'Noto Sans', system-ui, sans-serif" font-size="14" fill="#999999">payload cap 256 KiB</text>

  <line x1="320" y1="372" x2="320" y2="422" stroke="#333333" stroke-width="1"/>
  <polygon points="308,416 320,422 332,416" fill="#52a8ff"/>

