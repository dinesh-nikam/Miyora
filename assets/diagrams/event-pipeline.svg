  <rect x="40" y="482" width="560" height="10" rx="5" fill="#52a8ff"/>
  <text x="110" y="472" font-family="'Segoe UI', 'Noto Sans', system-ui, sans-serif" font-size="22" font-weight="800" fill="#ffffff">Local hook IPC (v1)</text>
  <text x="110" y="530" font-family="'Segoe UI', 'Noto Sans', system-ui, sans-serif" font-size="14" fill="#999999">named pipe (Windows) or Unix socket</text>
  <text x="110" y="578" font-family="'Segoe UI', 'Noto Sans', system-ui, sans-serif" font-size="14" fill="#999999">length-prefixed frames Â· shared-secret handshake</text>
  <text x="110" y="626" font-family="'Segoe UI', 'Noto Sans', system-ui, sans-serif" font-size="14" fill="#999999">rate limit 120 submits/minute Â· timestamp window and expiry checks</text>

  <line x1="320" y1="527" x2="320" y2="577" stroke="#333333" stroke-width="1"/>
  <polygon points="308,571 320,577 332,571" fill="#52a8ff"/>

  <rect x="40" y="597" width="560" height="182" rx="18" fill="#111111" stroke="#4a4a4a"/>
  <rect x="40" y="597" width="560" height="40" rx="18" fill="#1a1a1a" stroke="none"/>
  <rect x="40" y="637" width="560" height="10" rx="5" fill="#52a8ff"/>
  <text x="110" y="627" font-family="'Segoe UI', 'Noto Sans', system-ui, sans-serif" font-size="22" font-weight="800" fill="#ffffff">agentpet-core (SQLite)</text>
  <text x="110" y="685" font-family="'Segoe UI', 'Noto Sans', system-ui, sans-serif" font-size="14" fill="#999999">accepted event persisted before ack Â· replay-safe (idempotent)</text>
  <text x="110" y="733" font-family="'Segoe UI', 'Noto Sans', system-ui, sans-serif" font-size="14" fill="#999999">agent sessions, hook install records, progression state</text>
  <text x="110" y="781" font-family="'Segoe UI', 'Noto Sans', system-ui, sans-serif" font-size="14" fill="#999999">SQLite only; no cloud reach, no network</text>

  <line x1="320" y1="688" x2="320" y2="737" stroke="#333333" stroke-width="1"/>
  <polygon points="308,731 320,737 332,731" fill="#52a8ff"/>
  <rect x="40" y="757" width="560" height="108" rx="18" fill="#111111" stroke="#4a4a4a"/>
  <rect x="40" y="757" width="560" height="40" rx="18" fill="#1a1a1a" stroke="none"/>
  <rect x="40" y="797" width="560" height="10" rx="5" fill="#62c073"/>
  <text x="110" y="787" font-family="'Segoe UI', 'Noto Sans', system-ui, sans-serif" font-size="22" font-weight="800" fill="#ffffff">pet-engine</text>
  <text x="110" y="835" font-family="'Segoe UI', 'Noto Sans', system-ui, sans-serif" font-size="14" fill="#999999">explicit transition allow-list Â· timed reactions Â· animation fallback</text>

