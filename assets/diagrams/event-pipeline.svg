  <polygon points="948,682 960,694 972,682" fill="#52a8ff"/>

  <rect x="40" y="900" width="1200" height="60" rx="18" fill="#121212" stroke="#333333"/>
  <text x="60" y="936" font-family="'Segoe UI', 'Noto Sans', system-ui, sans-serif" font-size="15" fill="#999999">No telemetry. No cloud require. Zero secrets in SQLite. Token usage recorded only when a provider adapter supplies measured counts.</text>
