[workspace]
resolver = "2"
members = [
    "crates/agentpet-core",
    "crates/pet-engine",
    "crates/pet-pack",
    "crates/agentpet-adapters",
    "crates/agentpet-cli",
    "apps/desktop/src-tauri",
]

[workspace.package]
edition = "2021"
license = "MIT"
rust-version = "1.78"

[workspace.dependencies]
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "v5", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
ed25519-dalek = { version = "2", features = ["std"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
tar = "0.4"
flate2 = "1"
tokio = { version = "1", default-features = false, features = ["rt", "net", "io-util", "time", "sync", "macros"] }
tempfile = "3"
