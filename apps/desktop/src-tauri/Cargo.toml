[package]
name = "agentpet-desktop"
version = "0.1.0"
description = "Offline-first AI coding companion desktop app"
authors = ["AgentPet contributors"]
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "agentpet_desktop_lib"
crate-type = ["rlib"]
# shortcut: no unit tests live here (logic is in domain crates). On Windows a test
# harness linking the dialog plugin needs Tauri's comctl32 v6 manifest, which
# tauri-build only embeds in the app binary; re-enable when adding tests here.
test = false

[[bin]]
name = "agentpet-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64.workspace = true
agentpet-core = { path = "../../../crates/agentpet-core" }
agentpet-adapters = { path = "../../../crates/agentpet-adapters" }
agentpet-avatar = { path = "../../../crates/avatar" }
agentpet-pet-engine = { path = "../../../crates/pet-engine" }
agentpet-pet-pack = { path = "../../../crates/pet-pack" }
agentpet-studio = { path = "../../../crates/studio" }
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"

[features]
default = []
dev-simulator = ["agentpet-core/dev-simulator"]
